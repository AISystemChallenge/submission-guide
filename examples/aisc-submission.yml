# AI System Challenge 제출 workflow (모든 팀 공통, AISC_IMAGE만 팀마다 다릅니다)
# 팀 등록 때 AISystemChallenge가 이 파일을 저장소 기본 branch에 commit합니다.
# 정식 release를 발행(publish)하면 Dockerfile로 이미지를 빌드해 AISC_IMAGE:<release tag>로 ghcr.io에 push합니다.
# 대회 시스템은 이 저장소에 연결된 패키지에서 release tag와 같은 tag를 찾아 제출로 접수합니다.
# pre-release도 같은 방법으로 빌드하지만(시험 빌드) 제출이 아닙니다.
# GITHUB_TOKEN으로 push하므로 이미지 패키지는 이 저장소에 자동으로 연결됩니다.
name: AI System Challenge submission

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  # 팀 등록 때 자동 기록. 바꾸면 제출 이미지를 찾지 못합니다.
  AISC_IMAGE: ghcr.io/<owner>/<name>
  # Dockerfile 경로(저장소 루트 기준). 다시 등록하면 기본값으로 돌아갑니다.
  AISC_DOCKERFILE: Dockerfile

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # release 값은 env로만 넘깁니다(run 안에 github.event 값을 직접 넣지 않습니다).
      - name: Check the release tag
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::release tag가 docker tag 규칙(영문·숫자·_ . -, 128자 이하, 첫 글자는 영문·숫자·_)에 맞지 않아 이미지를 만들지 않습니다."
            exit 1
          fi
          echo "ref=${AISC_IMAGE}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.AISC_DOCKERFILE }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
